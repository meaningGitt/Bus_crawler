# 앉을지도 - 교통 데이터 수집 파이프라인 설정
project:
  name: "anjeul-jido-transit-crawler"
  description: "앉을지도 서비스를 위한 미확보 교통 데이터 수집 파이프라인"
  version: "1.0.0"

# API 엔드포인트
apis:
  # 공공데이터포털 (data.go.kr)
  data_go_kr:
    # 국토교통부 TAGO 버스노선정보
    tago_bus_route:
      base_url: "https://apis.data.go.kr/1613000/BusRouteInfoInqireService"
      endpoints:
        route_list: "/getRouteNoList"
        route_info: "/getRouteInfoIem"
        route_stops: "/getRouteAcctoThrghSttnList"
      rate_limit_per_day: 10000
      format: "json"

    # 국토교통부 TAGO 버스정류장정보
    tago_bus_stop:
      base_url: "https://apis.data.go.kr/1613000/BusSttnInfoInqireService"
      endpoints:
        stop_by_name: "/getSttnNoList"
        stop_by_pos: "/getCrdntPrxmtSttnList"
        routes_at_stop: "/getRouteBySttn"
        city_codes: "/getCityCodeList"
      rate_limit_per_day: 10000
      format: "json"

    # 국토교통부 TAGO 버스도착정보
    tago_bus_arrival:
      base_url: "https://apis.data.go.kr/1613000/ArvlInfoInqireService"
      endpoints:
        arrival_info: "/getSttnAcctoArvlPrearngeInfoList"
      rate_limit_per_day: 10000
      format: "json"

    # 서울교통공사 열차시간표
    subway_schedule:
      base_url: "https://apis.data.go.kr/B553766/schedule"
      endpoints:
        schedule: "/schedule"
      format: "json"

    # 코레일 열차운행정보
    korail:
      base_url: "https://apis.data.go.kr/B551457/run/v2"
      endpoints:
        train: "/train"
      format: "json"

    # 경기도 버스노선
    gyeonggi_bus:
      base_url: "https://apis.data.go.kr/6410000/busrouteservice/v2"
      endpoints:
        route_list: "/getBusRouteListv2"
        route_info: "/getBusRouteInfoItemv2"
        route_stops: "/getRouteStationListv2"
      format: "json"

    # 인천 버스노선
    incheon_bus:
      base_url: "https://apis.data.go.kr/6280000/busRouteService"
      endpoints:
        route_list: "/getBusRouteList"
        route_info: "/getBusRouteInfoItem"
        route_stops: "/getBusRouteStationList"
      format: "xml"

    # 인천 버스도착
    incheon_bus_arrival:
      base_url: "https://apis.data.go.kr/6280000/busArrivalService"
      endpoints:
        arrival_all: "/getAllRouteBusArrivalList"
      format: "xml"

  # 서울시 버스정보 (ws.bus.go.kr)
  seoul_bus:
    base_url: "http://ws.bus.go.kr/api/rest"
    endpoints:
      route_list: "/busRouteInfo/getBusRouteList"
      route_info: "/busRouteInfo/getRouteInfo"
      route_stops: "/busRouteInfo/getStaionByRoute"
      stop_by_name: "/stationinfo/getStationByName"
      stop_first_last: "/stationinfo/getBustimeByStation"
      arrival: "/arrive/getArrInfoByRoute"
    rate_limit_per_endpoint: 1000
    format: "json"

  # 서울 지하철 실시간 도착
  seoul_subway_realtime:
    base_url: "http://swopenAPI.seoul.go.kr/api/subway"
    format: "json"

