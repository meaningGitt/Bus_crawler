# 지하철 노선 정보
subway_lines:
  - name: "1호선"
    operator: "서울교통공사/코레일"
    directions: ["상행", "하행"]
  - name: "2호선"
    operator: "서울교통공사"
    directions: ["내선", "외선"]
  - name: "3호선"
    operator: "서울교통공사"
    directions: ["상행", "하행"]
  - name: "4호선"
    operator: "서울교통공사"
    directions: ["상행", "하행"]
  - name: "5호선"
    operator: "서울교통공사"
    directions: ["상행", "하행"]
  - name: "6호선"
    operator: "서울교통공사"
    directions: ["상행", "하행"]
  - name: "7호선"
    operator: "서울교통공사"
    directions: ["상행", "하행"]
  - name: "8호선"
    operator: "서울교통공사"
    directions: ["상행", "하행"]
  - name: "9호선"
    operator: "서울시메트로9호선"
    directions: ["상행", "하행"]

# 수집 설정
collection:
  request_interval_seconds: 0.5
  max_retries: 3
  retry_delay_seconds: 5
  timeout_seconds: 30
  max_concurrent_requests: 3
  user_agent: "AnjeulJido-DataCollector/1.0 (transit-research)"

# 데이터 품질 검증 규칙
quality:
  required_fields:
    bus_route: ["region", "route_id", "route_name", "route_type", "start_stop", "end_stop"]
    bus_stop: ["region", "stop_id", "stop_name", "latitude", "longitude"]
    bus_route_stop: ["region", "route_id", "stop_id", "stop_sequence", "direction"]
    bus_service_hours: ["region", "route_id", "day_type", "first_bus", "last_bus"]
    subway_last_train: ["line", "station", "direction", "day_type", "last_train_time", "destination"]
    subway_transfer: ["transfer_station", "from_line", "to_line", "transfer_time_seconds"]
  date_format: "%Y-%m-%d"
  time_format: "%H:%M:%S"

# 출력 경로
output:
  new_data_dir: "data/new"
  quarantine_dir: "data/quarantine"
  reports_dir: "data/reports"
  logs_dir: "logs"
